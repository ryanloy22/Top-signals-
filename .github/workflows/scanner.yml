name: TradeSignal Scanner

on:
  schedule:
    # Every hour 6:00 AM – 5:00 PM Denver MDT (UTC-7): 13:00-23:00 UTC + midnight UTC
    - cron: '0 0,13-23 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-scanner]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  SENDGRID_API_KEY:   ${{ secrets.SENDGRID_API_KEY }}
  ALERT_EMAIL_FROM:   ${{ secrets.ALERT_EMAIL_FROM }}
  ALERT_EMAIL_TO:     ${{ secrets.ALERT_EMAIL_TO }}
  ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dedup — skip if scanner ran within last 50 minutes
        id: dedup
        run: |
          if [ -f scan_results.json ]; then
            LAST_SCAN=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('scan_results.json'))
            print(d.get('generated_at', '1970-01-01T00:00:00+00:00'))
          except Exception:
            print('1970-01-01T00:00:00+00:00')
          " 2>/dev/null)
            NOW_TS=$(date +%s)
            LAST_TS=$(date -d "$LAST_SCAN" +%s 2>/dev/null || echo 0)
            DIFF=$((NOW_TS - LAST_TS))
            echo "Last scan: $LAST_SCAN ($DIFF seconds ago)"
            if [ "$DIFF" -lt 3000 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭ Skipping — scanner ran $DIFF seconds ago (< 50 min)"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install numpy pandas yfinance ta python-dotenv twilio sendgrid alpaca-py

      - name: Run scanner
        if: steps.dedup.outputs.skip != 'true'
        run: python scanner.py

      - name: Commit scan results
        if: steps.dedup.outputs.skip != 'true'
        run: |
          git config --global user.name  "TradeSignal Bot"
          git config --global user.email "bot@tradesignal"
          git fetch origin main
          git reset --soft origin/main
          git add scan_results.json scan_history.json hc_alerts.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
