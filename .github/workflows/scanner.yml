name: TradeSignal Scanner

on:
  schedule:
    # Backup: every hour 12:00-23:00 UTC (GitHub may delay these up to several hours)
    - cron: '0 12-23 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-scanner]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  SENDGRID_API_KEY:   ${{ secrets.SENDGRID_API_KEY }}
  ALERT_EMAIL_FROM:   ${{ secrets.ALERT_EMAIL_FROM }}
  ALERT_EMAIL_TO:     ${{ secrets.ALERT_EMAIL_TO }}
  ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas yfinance ta python-dotenv twilio sendgrid alpaca-py

      - name: Run scanner
        run: python scanner.py

      - name: Commit scan results
        run: |
          git config --global user.name  "TradeSignal Bot"
          git config --global user.email "bot@tradesignal"
          git fetch origin main
          git reset --soft origin/main
          git add scan_results.json scan_history.json hc_alerts.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
