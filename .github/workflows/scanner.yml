name: TradeSignal Scanner

on:
  schedule:
    # Every hour 6am-6pm Denver MDT (UTC-6) = 12:00-00:00 UTC
    # Monday through Sunday
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas yfinance ta python-dotenv twilio sendgrid

      - name: Run scanner
        run: python scanner.py

      - name: Commit scan results
        run: |
          git config --global user.name  "TradeSignal Bot"
          git config --global user.email "bot@tradesignal"
          git fetch origin main
          git reset --soft origin/main
          git add scan_results.json scan_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
